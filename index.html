<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Malaria Diagnosis DSS</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px;
           margin: 60px auto; background: #f5f5f5; }
    h1 { color: #1F4E5C; }
    .card { background: white; padding: 40px; border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    button { background: #1F4E5C; color: white; padding: 12px 30px;
             border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Malaria Diagnosis System</h1>
    <p>Upload a blood smear cell image to receive an AI-assisted diagnosis,
       visual explanation, and clinical recommendation.</p>
    <form action="/predict" method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required><br><br>
      <button type="submit">Analyse Image</button>
    </form>
  </div>
</body>
</html>
